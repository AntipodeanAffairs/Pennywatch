name: PennyWatch daily refresh

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and classify tweets
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python build_tracker.py

      - name: Diagnostic — verify token and list projects
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJ: ${{ secrets.CF_PROJECT_NAME }}
        run: |
          echo "=== Token verification ==="
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | python -m json.tool
          echo ""
          echo "=== Accounts the token can see ==="
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/accounts \
            | python -m json.tool
          echo ""
          echo "=== Pages projects in CF_ACCT ==="
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/pages/projects" \
            | python -m json.tool
          echo ""
          echo "=== Length checks ==="
          echo "CF_TOKEN length: ${#CF_TOKEN}"
          echo "CF_ACCT length: ${#CF_ACCT}   (should be 32)"
          echo "CF_PROJ length: ${#CF_PROJ}   (should be 20 for throbbing-block-f2d0)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ secrets.CF_PROJECT_NAME }} --branch=main --commit-dirty=true
